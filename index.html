<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дифференциалдық Теңдеулер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Дифференциалды Теңдеулер</h1>
    </header>

    <div class="book-container">
        <div class="sidebar">
            <h3>Бөлімдер</h3>

            <button class="section-button" onclick="showDocuments('intro')">Кіріспе</button>
            <ul id="intro-list" class="document-list" style="display:none;"></ul>

            <button class="section-button" onclick="showDocuments('lek')">Дәрістер</button>
            <ul id="lek-list" class="document-list" style="display:none;"></ul>

            <button class="section-button" onclick="showDocuments('q')">Сұрақтар</button>
            <ul id="q-list" class="document-list" style="display:none;"></ul>

            <button class="section-button" onclick="showDocuments('p')">Практикалар</button>
            <ul id="p-list" class="document-list" style="display:none;"></ul>

            <button class="section-button" onclick="showDocuments('task')">Тапсырмалар</button>
            <ul id="task-list" class="document-list" style="display:none;"></ul>

            <button class="section-button" onclick="showDocuments('glossary')">Глоссарий</button>
            <ul id="glossary-list" class="document-list" style="display:none;"></ul>
        </div>

        <div class="content-area">
            <div id="documents-container">
                <iframe id="wordViewer" src="" frameborder="0" width="100%" height="100%"></iframe>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
